name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Before a merge and nightly: a pair of pull requests is proven together before either merges. Two jobs side by side,
  # whose result `compatibility`, the required check, reports.
  tests:
    name: tests and conformance
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      # Node 24: on 22 its V8 aborts a test file now and then ("unreachable code" in the deoptimizer). The package,
      # docs site, starter and installed jobs stay on 22, the oldest Node the package supports.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # For the Bridge's pick below. The start step merges the pull requests a Depends-On: line names here into this
      # checkout and runs compatibility.json's host setup, `npm ci`, before the conformance command, so the steps after
      # it run on that merge's lockfile; they run only once it has, which a conformance report shows.
      - run: npm ci
      # The Bridge's build, picked with the job's token and kept for the conformance command the start step runs, which
      # holds none.
      - run: npm run --silent bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Checks the vocabulary and the adapters out beside this repository, and runs the conformance command on them once.
      - id: start
        uses: jayostis/cascade-bridge-spec/.github/actions/start@main
      - name: The report the conformance command wrote
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REPORT: ${{ steps.start.outputs.report }}
        run: |
          set -euo pipefail
          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "::error::the start step named no conformance report: '$REPORT'"
            exit 1
          fi
          echo "CASCADE_CONFORMANCE_REPORT=$REPORT" >> "$GITHUB_ENV"
      - if: ${{ !cancelled() && env.CASCADE_CONFORMANCE_REPORT != '' }}
        run: npm run typecheck
      # Every rule beside the note that ruled it and this run's result; its warnings fail nothing yet. Kept as an
      # artifact; the pages on main show the `conformance` job's run, not this one.
      - name: The spec's pages
        if: ${{ !cancelled() && env.CASCADE_CONFORMANCE_REPORT != '' }}
        continue-on-error: true
        run: node packages/site/dist/src/node/cli.js build-spec --report "$CASCADE_CONFORMANCE_REPORT"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && env.CASCADE_CONFORMANCE_REPORT != '' }}
        with:
          name: spec
          path: cascade-runtime-js/build/spec
          if-no-files-found: warn
      - if: ${{ !cancelled() && env.CASCADE_CONFORMANCE_REPORT != '' }}
        run: npm run lint
      # Nightly, the `runtime-tests` job runs the suite and keeps its report: once a night, not twice.
      - if: ${{ !cancelled() && env.CASCADE_CONFORMANCE_REPORT != '' && github.event_name != 'schedule' }}
        run: npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The docs site as Pages would serve it: `build-pages` runs the same command, and this job keeps the tree it wrote.
  browser:
    name: docs site
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    env:
      CASCADE_ROWS_CACHE: ${{ github.workspace }}/cascade-runtime-js/.rows-cache
    # The start action's comment on the pull request is the tests job's to post.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # Checks the vocabulary and the adapters out beside this repository, and merges into it the pull requests a
      # Depends-On: line names here, before the install reads the lockfile; the package and the pages read those.
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      - run: npm ci
      # The reference tables' row files are named by their content, so a copy kept from an earlier run is as good as a
      # fresh download, and a Pages blip cannot fail a run. What a run fetched anew is saved; a push to main saves where a pull request reads.
      - id: rows
        uses: actions/cache/restore@v6
        with:
          path: cascade-runtime-js/.rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}
          restore-keys: table-rows-${{ runner.os }}-
      - id: rows-before
        shell: bash
        run: echo "hash=${{ hashFiles('cascade-runtime-js/.rows-cache/**') }}" >> "$GITHUB_OUTPUT"
      - name: Pack the package, whose published samples the example pods are
        if: ${{ !cancelled() }}
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The counterparts the start step checked out, a pull request named on Depends-On among them.
          CASCADE_PACK_SIBLINGS: ${{ github.workspace }}
      # The whole tree, as the deploy builds it: every kit's pod and site, the front page, the quick start and the eval
      # report from the recorded runs (CI never calls a model, it only checks every recorded run renders).
      - name: Build the Pages tree
        if: ${{ !cancelled() }}
        run: npm run build:pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Every link of the tree resolves as a file, its anchor in it, and a GitHub link into a repository checked out beside
      # this one is read in that checkout, since a pull request's commit is on no server. The addresses on other sites are
      # not asked here but saved, for `external links`, which asks them off this job's path.
      - name: Every link of the tree resolves
        if: ${{ !cancelled() }}
        run: >-
          node scripts/link-check.mjs --tree build/pages --no-external --save-external build/external-links.json
          --checkout jayostis/cascade-runtime-js=.
          --checkout jayostis/cascade-vocabulary=../cascade-vocabulary
          --checkout jayostis/cascade-bridge-adapter-fhir-r4=../cascade-bridge-adapter-fhir-r4
          --checkout jayostis/cascade-bridge-adapter-ccda=../cascade-bridge-adapter-ccda
      # The browser the `live` job caches on main; a pull request reads it.
      - id: playwright
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        if: ${{ !cancelled() }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npx playwright install --only-shell chromium
        if: ${{ !cancelled() }}
      # A newcomer on the front page of this tree reaches each row of "Find your way" in one click, on a page of the expected title.
      - name: Walk the front page's rows
        if: ${{ !cancelled() }}
        run: npm run test:walkthrough
        env:
          WALK_TREE: build/pages
      - name: Drop half-written row files before they are saved
        if: ${{ !cancelled() }}
        shell: bash
        run: rm -f "$CASCADE_ROWS_CACHE"/*.tmp
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && hashFiles('cascade-runtime-js/.rows-cache/**') != '' && hashFiles('cascade-runtime-js/.rows-cache/**') != steps.rows-before.outputs.hash }}
        with:
          path: cascade-runtime-js/.rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}-${{ github.job }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pages
          path: cascade-runtime-js/build/pages
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: external-links
          path: cascade-runtime-js/build/external-links.json
          if-no-files-found: error

  # The addresses on other sites that the tree links, asked once each with retries: a 404 is red, a host that does not
  # answer is a warning. Alone and after `docs site`, since asking about five hundred addresses takes a minute, and not
  # in `compatibility`, since a host that moved a page is not this pull request's doing. Not nightly: `live links` asks the
  # same addresses of the deployed site then, and the outside is asked once a night.
  external-links:
    name: external links
    needs: browser
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.browser.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v7
        with:
          name: external-links
          path: build
      - run: node scripts/link-check.mjs --only-external build/external-links.json

  # The reverse check: the starter kit's own tests and checks, run on this commit's tarball. A change the starter must
  # follow lands as a pair: this pull request's body carries `Depends-On: https://github.com/jayostis/cascade-starter-kit/pull/<n>`
  # (the start action refuses the short form), and the starter is then taken at that pull request's head instead of its main.
  starter-kit:
    name: starter-kit
    if: ${{ github.event_name != 'push' && !startsWith(github.base_ref, 'alpha/') }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Four parts side by side, each on its own runner: the starter's suites, its browser tests, and the made app without
    # and with the add-ons. `compatibility` reads them as one result, which fails when any part fails.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: suites
          - part: browser
          - part: app
          # The chat and MCP add-ons are the app's only with `--with`, so the base app never runs them. Linux only: on
          # Windows a second check would double its six-minute job, as the starter's own create.yml keeps it.
          - part: app
            with: chat,mcp
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Only the action is checked out: the starter is cloned beside it.
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: starter
        uses: ./cascade-runtime-js/.github/actions/starter
        with:
          package: ${{ runner.temp }}/package
      - name: The starter's types and tests
        if: ${{ matrix.part == 'suites' }}
        working-directory: ${{ steps.starter.outputs.path }}
        run: |
          npm run typecheck
          npm test
      - name: Build try/ and the samples over this tarball
        if: ${{ matrix.part == 'browser' }}
        working-directory: ${{ steps.starter.outputs.path }}
        run: npm run build:try
      - id: playwright
        if: ${{ matrix.part != 'suites' }}
        working-directory: ${{ steps.starter.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@v6
        if: ${{ matrix.part != 'suites' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - id: install
        if: ${{ matrix.part != 'suites' }}
        working-directory: ${{ steps.starter.outputs.path }}
        run: npx playwright install --only-shell chromium
      - uses: actions/cache/save@v6
        if: ${{ steps.install.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - name: try/ and the starter in Chromium
        if: ${{ matrix.part == 'browser' }}
        timeout-minutes: 15
        working-directory: ${{ steps.starter.outputs.path }}
        run: npm run test:browser
      # The command a person runs, on the app it makes, with the runtime from this tarball instead of the pin.
      - name: create-cascade-app ${{ matrix.with && format('--with {0}', matrix.with) || '' }}, on this tarball
        if: ${{ matrix.part == 'app' }}
        env:
          STARTER: ${{ steps.starter.outputs.path }}
          TARBALL: ${{ steps.starter.outputs.tarball }}
          WITH: ${{ matrix.with }}
        run: |
          set -euo pipefail
          (cd "$STARTER" && npm run build:create)
          cd "$RUNNER_TEMP"
          node "$STARTER/check/starter.ts" "$STARTER"/build/create-cascade-app-*.tgz --runtime "$TARBALL" ${WITH:+--with "$WITH"}

  # The made app on the other systems, as the deleted installed.yml `starter` job ran it: windows on a pull request,
  # windows and macos on a push, the nightly run and by hand. Like `other-systems`, nothing needs it and `compatibility`
  # does not wait for it, so a slow system gates no merge, and a failure still fails the run. The starter is taken exactly
  # as `starter-kit` takes it; only the build of the command and the app's check run, not the starter's suites.
  starter-systems:
    name: starter (${{ matrix.os }})
    if: ${{ !startsWith(github.base_ref, 'alpha/') }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest"]' || '["windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: starter
        uses: ./cascade-runtime-js/.github/actions/starter
        with:
          package: ${{ runner.temp }}/package
      # The check reads the made app's screens in Chromium.
      - name: Chromium's headless shell
        working-directory: ${{ steps.starter.outputs.path }}
        run: npx playwright install --only-shell chromium
      - name: create-cascade-app, on this tarball
        env:
          STARTER: ${{ steps.starter.outputs.path }}
          TARBALL: ${{ steps.starter.outputs.tarball }}
        run: |
          set -euo pipefail
          (cd "$STARTER" && npm run build:create)
          cd "$RUNNER_TEMP"
          node "$STARTER/check/starter.ts" "$STARTER"/build/create-cascade-app-*.tgz --runtime "$TARBALL"

  # The name branch protection requires. A part that was skipped is no pass, except starter-kit on a pull request into an alpha/ branch.
  compatibility:
    name: compatibility
    needs: [tests, browser, starter-kit, runtime-tests]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TESTS: ${{ needs.tests.result }}
          BROWSER: ${{ needs.browser.result }}
          STARTER: ${{ needs.starter-kit.result }}
          RUNTIME_TESTS: ${{ needs.runtime-tests.result }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "tests and conformance: ${TESTS}; docs site: ${BROWSER}; starter-kit: ${STARTER}; runtime tests: ${RUNTIME_TESTS}"
          [ "${TESTS}" = success ] && [ "${BROWSER}" = success ] || exit 1
          # The suite runs in `runtime-tests` on the nightly run, where `tests and conformance` leaves it out. On a pull
          # request or a hand-started run that job is skipped, and the suite ran in `tests and conformance`.
          if [ "${EVENT}" = schedule ]; then [ "${RUNTIME_TESTS}" = success ] || exit 1; fi
          # starter-kit does not run on a pull request into an integration branch; it is skipped by that rule alone.
          case "${BASE}" in
            alpha/*) [ "${STARTER}" = skipped ] || [ "${STARTER}" = success ] ;;
            *) [ "${STARTER}" = success ] ;;
          esac

  # The conformance run of main that the Pages tree shows. `tests and conformance` is skipped on a push and its report is
  # not kept for the site, so this job runs the start action alone, on a push and nightly, and keeps the report with the
  # table the check wrote beside it under the artifact name `conformance`. The tests, the lint and the types are not its
  # business, and `build-pages` waits for the job and not for its verdict.
  conformance:
    name: conformance
    if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      # Node 24 as the tests job runs the same check.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      - run: npm ci
      # The Bridge's build, picked with the job's token and kept for the conformance command, which holds none.
      - run: npm run --silent bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: start
        uses: jayostis/cascade-bridge-spec/.github/actions/start@main
      # The start action names the report it wrote and keeps its table.md two folders up. A run that wrote none keeps
      # nothing, and the pages show every result as not run.
      - name: Keep the report and its table
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REPORT: ${{ steps.start.outputs.report }}
        run: |
          set -euo pipefail
          kept="$RUNNER_TEMP/conformance"
          mkdir -p "$kept"
          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "::warning::the start step named no conformance report: '$REPORT'"
            exit 0
          fi
          cp "$REPORT" "$kept/earl.ttl"
          table="$(dirname "$(dirname "$REPORT")")/table.md"
          if [ -f "$table" ]; then cp "$table" "$kept/table.md"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: conformance
          path: ${{ runner.temp }}/conformance
          if-no-files-found: ignore

  # The runtime's own tests on main, in a job the deploy does not wait for: `build-pages` shows the newest finished run's
  # report, as it shows the vocabulary's. A timeout stops a hang. The log stays the spec reporter's; the JUnit file is the
  # test page's, node's own with each case's line in its TypeScript source added, for the page to link to. The tests read the vocabulary beside this checkout, which the start action checks out and does not run. A
  # failing case fails the job, and the report is still kept.
  # Nightly this is the one run of the suite: `tests and conformance` leaves it out then, and `compatibility` waits for this job.
  runtime-tests:
    name: runtime tests
    if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      # Node 24 as the tests job runs the same suite.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      - run: npm ci
      # The Bridge's build, which the suite's Bridge tests read.
      - run: npm run --silent bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # npm test transpiles its own sources, so it needs no build first.
      - name: The runtime's tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kept="$RUNNER_TEMP/runtime-tests"
          mkdir -p "$kept"
          printf '{"commit":"%s","at":"%s","url":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$kept/run.json"
          npm test -- --test-reporter=./scripts/junit-reporter.mjs --test-reporter-destination="$kept/junit.xml" \
            --test-reporter=spec --test-reporter-destination=stdout
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: runtime-tests
          path: ${{ runner.temp }}/runtime-tests
          if-no-files-found: ignore

  # The vocabulary, the adapters and the Bridge are each read at the head of their default branch. On a push to main, and
  # nightly, so a merge in the vocabulary or an adapter reaches the pages the next night. It waits for the conformance
  # run's report and not for its verdict: a red run still deploys, with its failures on the pages, and a run that kept no
  # report deploys with every result shown as not run. It does not wait for the runtime's tests (the page shows their newest
  # finished run, at most one push behind), so the deploy waits no longer than the conformance job.
  build-pages:
    name: build-pages
    needs: [conformance]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # `actions` lets the test reports' lookup list this repository's runs, which a private one would refuse by default.
    permissions:
      contents: read
      actions: read
    env:
      CASCADE_ROWS_CACHE: ${{ github.workspace }}/.rows-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The reference tables' row files are named by their content, so a copy kept from an earlier run is as good as a
      # fresh download, and a Pages blip cannot fail a run. What a run fetched anew is saved; a push to main saves where a pull request reads.
      - id: rows
        uses: actions/cache/restore@v6
        with:
          path: .rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}
          restore-keys: table-rows-${{ runner.os }}-
      - id: rows-before
        shell: bash
        run: echo "hash=${{ hashFiles('.rows-cache/**') }}" >> "$GITHUB_OUTPUT"
      - name: Pack the package, whose published samples the example pods are
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Nothing to download when the conformance run kept no report, which is no failure.
      - name: The conformance run's report
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: conformance
          path: build/conformance
      # The unit test page shows the newest run of each suite on main, case by case: for each repository, the newest push or
      # nightly run of its check workflow that still holds the report's artifact (a cancelled or unfinished run does not),
      # so the page is at most one push behind and the deploy never waits for a suite. Where the job's token may not
      # download it, the page says "not available" for that suite and the deploy goes on.
      - name: The test reports
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # fetch <repository> <artifact> <folder> <the report's file in the artifact>
          fetch() {
            local repository=$1 artifact=$2 kept=$3 file=$4 runs id sha at url try="$3/.try"
            mkdir -p "$kept"
            if ! runs=$(gh run list -R "$repository" -w check.yml -b main --limit 20 \
              --json databaseId,event,headSha,createdAt,url \
              --jq '.[] | select(.event == "push" or .event == "schedule") | [.databaseId, .headSha, .createdAt, .url] | @tsv'); then
              echo "::warning::cannot list the runs of $repository, so its test report is not available"
              return 0
            fi
            while IFS=$'\t' read -r id sha at url; do
              [ -n "$id" ] || continue
              # A fresh folder per candidate: gh does not overwrite and exits 0 on "The file exists", so a half-kept artifact
              # (run.json without the report) would poison every older candidate. The report being there is the success.
              rm -rf "$try"
              mkdir -p "$try"
              gh run download "$id" -R "$repository" -n "$artifact" -D "$try" >/dev/null 2>&1 || true
              if [ -f "$try/$file" ]; then
                [ "$file" = junit.xml ] || mv "$try/$file" "$try/junit.xml"
                [ -f "$try/run.json" ] || printf '{"commit":"%s","at":"%s","url":"%s"}\n' "$sha" "$at" "$url" > "$try/run.json"
                mv "$try"/* "$kept"/
                rm -rf "$try"
                echo "the test report of $repository is of run $id ($url)"
                return 0
              fi
            done <<< "$runs"
            rm -rf "$try"
            echo "::warning::none of the newest runs of $repository holds a $artifact artifact this job can download, so its test report is not available"
          }
          fetch "$GITHUB_REPOSITORY" runtime-tests build/tests/runtime junit.xml
          fetch jayostis/cascade-vocabulary pytest-junit build/tests/vocabulary pytest-junit.xml
      - name: Build the Pages tree
        run: npm run build:pages -- --report build/conformance/earl.ttl --tests build/tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # llms.txt links absolutely under the address the deploy serves; the pull request's artifact leaves it unset.
          PAGES_URL: https://jayostis.github.io/cascade-runtime-js/
      - name: Drop half-written row files before they are saved
        if: ${{ !cancelled() }}
        shell: bash
        run: rm -f "$CASCADE_ROWS_CACHE"/*.tmp
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && hashFiles('.rows-cache/**') != '' && hashFiles('.rows-cache/**') != steps.rows-before.outputs.hash }}
        with:
          path: .rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}-${{ github.job }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  pages:
    name: pages
    needs: [build-pages, release]
    # A push deploys what its release built; the nightly run has no release, only the tree to redeploy.
    if: ${{ !cancelled() && needs.build-pages.result == 'success' && (needs.release.result == 'success' || (github.event_name == 'schedule' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.tip.outputs.latest }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $head, not ${{ github.sha }}; the run for $head deploys"
          fi
      - if: ${{ steps.tip.outputs.latest == 'true' }}
        uses: actions/configure-pages@v6
      - id: deployment
        if: ${{ steps.tip.outputs.latest == 'true' }}
        uses: actions/deploy-pages@v5

  # The deployed site, as a person reaches it, once its deploy is served.
  live:
    name: live
    needs: pages
    if: ${{ github.event_name == 'push' && needs.pages.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # A push to main saves this cache where a pull request can read it.
      - id: playwright
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npx playwright install --only-shell chromium
      - uses: actions/cache/save@v6
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npm run test:live
        env:
          PAGES_URL: https://jayostis.github.io/cascade-runtime-js/
          COMMIT: ${{ github.sha }}

  # The deployed site once its deploy is served, and nightly: every link of every page, each README's Docs block and the
  # addresses on other sites, and a newcomer's walk from the front page and from each README. Nothing waits for it; a dead
  # link or a README without the hub's link fails the run.
  live-links:
    name: live links
    needs: [pages, live]
    if: ${{ !cancelled() && needs.pages.outputs.deployed == 'true' && (needs.live.result == 'success' || needs.live.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGES_URL: https://jayostis.github.io/cascade-runtime-js/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - id: playwright
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npx playwright install --only-shell chromium
      - uses: actions/cache/save@v6
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: node scripts/link-check.mjs --crawl --site "$PAGES_URL" --readmes
      - if: ${{ !cancelled() }}
        run: npm run test:walkthrough

  # connect and pull against the SMART launcher, a server this project did not write, over the network: nightly and by
  # hand only, so a network failure gates no pull request.
  launcher:
    name: launcher
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:launcher

  # The package, packed once, so every system below tests the same bytes: with the counterparts a pull request names on
  # Depends-On, which the start action checks out beside it, so a pair's two pull requests prove each other; else from the
  # head of every default branch.
  package:
    name: package
    runs-on: ubuntu-latest
    env:
      CASCADE_ROWS_CACHE: ${{ github.workspace }}/cascade-runtime-js/.rows-cache
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # Before the install, which reads the lockfile of the pull requests the start step merges into this checkout.
      - if: ${{ github.event_name == 'pull_request' }}
        uses: jayostis/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      - run: npm ci
      # The reference tables' row files are named by their content, so a copy kept from an earlier run is as good as a
      # fresh download, and a Pages blip cannot fail a run. What a run fetched anew is saved; a push to main saves where a pull request reads.
      - id: rows
        uses: actions/cache/restore@v6
        with:
          path: cascade-runtime-js/.rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}
          restore-keys: table-rows-${{ runner.os }}-
      - id: rows-before
        shell: bash
        run: echo "hash=${{ hashFiles('cascade-runtime-js/.rows-cache/**') }}" >> "$GITHUB_OUTPUT"
      - if: ${{ github.event_name == 'pull_request' }}
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CASCADE_PACK_SIBLINGS: ${{ github.workspace }}
      - if: ${{ github.event_name != 'pull_request' }}
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Drop half-written row files before they are saved
        if: ${{ !cancelled() }}
        shell: bash
        run: rm -f "$CASCADE_ROWS_CACHE"/*.tmp
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && hashFiles('cascade-runtime-js/.rows-cache/**') != '' && hashFiles('cascade-runtime-js/.rows-cache/**') != steps.rows-before.outputs.hash }}
        with:
          path: cascade-runtime-js/.rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}-${{ github.job }}
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            cascade-runtime-js/build/cascade-runtime-*.tgz
            cascade-runtime-js/build/cascade-mcp-*.tgz
            cascade-runtime-js/build/release-notes.md
          if-no-files-found: error

  # The package installed and used as a person would, on the systems `release` waits for.
  linux:
    needs: package
    uses: ./.github/workflows/installed.yml
    with:
      systems: '["ubuntu-latest"]'

  # The same jobs on the systems that finish last: nothing needs them, so a release does not wait, and a failure still fails the run.
  other-systems:
    needs: package
    uses: ./.github/workflows/installed.yml
    with:
      systems: ${{ github.event_name == 'pull_request' && '["windows-latest"]' || '["windows-latest", "macos-latest"]' }}

  # The tested tarball, as the pre-release build-<commit>, never the latest.
  release:
    name: release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: package
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is a release already"
            exit 0
          fi
          gh release create "$tag" package/cascade-runtime-*.tgz package/cascade-mcp-*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file package/release-notes.md \
            --prerelease \
            --latest=false
