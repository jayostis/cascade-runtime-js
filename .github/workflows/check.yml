name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # The check installs only once it reaches the run; the steps after it need the tools when it stops earlier.
      - run: npm ci
      # Checks the vocabulary and the adapters out beside this repository; every step after it reads those.
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
      - if: ${{ !cancelled() }}
        run: npm run typecheck
      - if: ${{ !cancelled() }}
        run: npm run lint
      - if: ${{ !cancelled() }}
        run: npm test
      - name: Build every kit's pod and site, and the front page above them
        if: ${{ !cancelled() }}
        run: npm run build:pages
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: alex-rivera
          path: |
            cascade-runtime-js/build/alex-rivera/pod
            cascade-runtime-js/build/alex-rivera/site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          path: cascade-runtime-js/build/pages

  pages:
    name: pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $head, not ${{ github.sha }}; the run for $head deploys"
          fi
      - if: ${{ steps.tip.outputs.latest == 'true' }}
        uses: actions/configure-pages@v6
      - id: deployment
        if: ${{ steps.tip.outputs.latest == 'true' }}
        uses: actions/deploy-pages@v5

  ready-to-merge:
    name: ready-to-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
        with:
          check: ready-to-merge
