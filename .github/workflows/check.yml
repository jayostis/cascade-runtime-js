name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Before a merge and nightly: a pair of pull requests is proven together before either merges.
  compatibility:
    name: compatibility
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # The check installs only once it reaches the run; the steps after it need the tools when it stops earlier.
      - run: npm ci
      # Checks the vocabulary and the adapters out beside this repository; every step after it reads those.
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
      - if: ${{ !cancelled() }}
        run: npm run typecheck
      - if: ${{ !cancelled() }}
        run: npm run lint
      - if: ${{ !cancelled() }}
        run: npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Pack the package, whose browser build try/ serves
        if: ${{ !cancelled() }}
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build every kit's pod and site, and the front page above them
        if: ${{ !cancelled() }}
        run: npm run build:pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: try/ in Chromium, served from build/pages
        if: ${{ !cancelled() }}
        run: npm run test:browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: alex-rivera
          path: |
            cascade-runtime-js/build/alex-rivera/pod
            cascade-runtime-js/build/alex-rivera/site
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: priya-natarajan
          path: |
            cascade-runtime-js/build/priya-natarajan/pod
            cascade-runtime-js/build/priya-natarajan/site
          if-no-files-found: error

  # The vocabulary, the adapters and the Bridge are each read at the head of their default branch.
  build-pages:
    name: build-pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pack the package, whose browser build try/ serves
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build every kit's pod and site, and the front page above them
        run: npm run build:pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  pages:
    name: pages
    needs: [build-pages, release, starter-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.tip.outputs.latest }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $head, not ${{ github.sha }}; the run for $head deploys"
          fi
      - if: ${{ steps.tip.outputs.latest == 'true' }}
        uses: actions/configure-pages@v6
      - id: deployment
        if: ${{ steps.tip.outputs.latest == 'true' }}
        uses: actions/deploy-pages@v5

  # The deployed site, as a person reaches it, once its deploy is served.
  live:
    name: live
    needs: pages
    if: ${{ needs.pages.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          PAGES_URL: https://jayostis.github.io/cascade-runtime-js/
          COMMIT: ${{ github.sha }}

  # connect and pull, and try/ in Chromium, against the SMART launcher, a server this project did not write, over the
  # network: nightly and by hand only, so a network failure gates no pull request.
  launcher:
    name: launcher
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pack the package, whose browser build try/ serves
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build every kit's pod and site, and the front page above them
        run: npm run build:pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:launcher

  # The package, packed once from the head of every default branch, so every system below tests the same bytes.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            build/cascade-runtime-*.tgz
            build/release-notes.md
          if-no-files-found: error

  # The developer stories' scripts and downloads, copied into the folder the package is installed in, run there on the installed package and can neither read nor write outside it.
  package-install:
    name: package-install (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Install the tarball into an empty folder
        working-directory: ${{ runner.temp }}/package
        env:
          CASCADE_RUNTIME_APP: ${{ runner.temp }}/app
        run: |
          tarball=$(node -p "require('node:path').resolve(process.argv[1])" cascade-runtime-*.tgz)
          mkdir "$CASCADE_RUNTIME_APP"
          cd "$CASCADE_RUNTIME_APP"
          npm install "$tarball"
      - name: The developer stories on the installed package
        env:
          CASCADE_RUNTIME_APP: ${{ runner.temp }}/app
        run: |
          cp -R developer-story/. "$CASCADE_RUNTIME_APP/"
          node --test packages/runtime/dist/test/developer-story.test.js
      - name: Everything installed is the package, bundled in it, or from npm's registry
        working-directory: ${{ runner.temp }}/app
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { packages } = JSON.parse(readFileSync("package-lock.json", "utf8"));
            const elsewhere = Object.entries(packages).filter(
              ([path, entry]) =>
                path !== "" &&
                path !== "node_modules/cascade-runtime" &&
                entry.inBundle !== true &&
                !entry.resolved?.startsWith("https://registry.npmjs.org/"),
            );
            for (const [path, entry] of elsewhere) console.error(`${path} came from ${entry.resolved}`);
            if (elsewhere.length > 0) process.exit(1);
            console.log(`${Object.keys(packages).length - 1} packages, each the package, bundled in it, or from https://registry.npmjs.org/`);
          '

  # The starter made by the command from the same tarball, and used as a person would, on each system.
  starter:
    name: starter (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: The starter's check, against the tarball
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/packages/cascade-runtime/check/starter.mjs" package/cascade-runtime-*.tgz

  # The tested tarball, as the pre-release build-<commit>, never the latest.
  release:
    name: release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [package-install, starter]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: package
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is a release already"
            exit 0
          fi
          gh release create "$tag" package/cascade-runtime-*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file package/release-notes.md \
            --prerelease \
            --latest=false

  # The command exactly as a person is told to run it, from the release just made.
  starter-release:
    name: starter-release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The starter's check, against the release
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/packages/cascade-runtime/check/starter.mjs" --release "$GITHUB_SHA"

  ready-to-merge:
    name: ready-to-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
        with:
          check: ready-to-merge
