name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Before a merge and nightly: a pair of pull requests is proven together before either merges. Two jobs side by side,
  # whose result `compatibility`, the required check, reports.
  tests:
    name: tests and conformance
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # The check installs only once it reaches the run; the steps after it need the tools when it stops earlier.
      - run: npm ci
      # Checks the vocabulary and the adapters out beside this repository, and runs the conformance command on them once.
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
      - name: The report the conformance command wrote
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          reports=("$RUNNER_TEMP"/compatibility-compatibility/earl/conformance-on-host-*.ttl)
          if [ "${#reports[@]}" -ne 1 ] || [ ! -f "${reports[0]}" ]; then
            echo "::error::expected one conformance report, found: ${reports[*]}"
            exit 1
          fi
          echo "CASCADE_CONFORMANCE_REPORT=${reports[0]}" >> "$GITHUB_ENV"
      - if: ${{ !cancelled() }}
        run: npm run typecheck
      - if: ${{ !cancelled() }}
        run: npm run lint
      - if: ${{ !cancelled() }}
        run: npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}

  browser:
    name: browser
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    # The start action's comment on the pull request is the tests job's to post.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      - run: npm ci
      # Checks the vocabulary and the adapters out beside this repository; the package and the pages read those.
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
      - name: Pack the package, whose browser build try/ serves
        if: ${{ !cancelled() }}
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The counterparts the start step checked out, a pull request named on Depends-On among them.
          CASCADE_PACK_SIBLINGS: ${{ github.workspace }}
      - name: Build every kit's pod and site, and the front page above them
        if: ${{ !cancelled() }}
        run: npm run build:pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Every test launches the headless shell and nothing launches the full Chrome, so only the shell is installed and kept.
      - id: playwright
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@v6
        if: ${{ !cancelled() }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - id: install
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps --only-shell chromium
      # Saved here, not after the job: a job that fails at the tests saves nothing.
      - uses: actions/cache/save@v6
        if: ${{ steps.install.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - name: try/ in Chromium, served from build/pages
        if: ${{ !cancelled() }}
        run: npm run test:browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: alex-rivera
          path: |
            cascade-runtime-js/build/alex-rivera/pod
            cascade-runtime-js/build/alex-rivera/site
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: priya-natarajan
          path: |
            cascade-runtime-js/build/priya-natarajan/pod
            cascade-runtime-js/build/priya-natarajan/site
          if-no-files-found: error

  # The name branch protection requires. A part that was skipped is no pass: nothing but both succeeding reports success.
  compatibility:
    name: compatibility
    needs: [tests, browser]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TESTS: ${{ needs.tests.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "tests and conformance: ${TESTS}; browser: ${BROWSER}"
          [ "${TESTS}" = success ] && [ "${BROWSER}" = success ]

  # The vocabulary, the adapters and the Bridge are each read at the head of their default branch.
  build-pages:
    name: build-pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pack the package, whose browser build try/ serves
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build every kit's pod and site, and the front page above them
        run: npm run build:pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  pages:
    name: pages
    needs: [build-pages, release, starter-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.tip.outputs.latest }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $head, not ${{ github.sha }}; the run for $head deploys"
          fi
      - if: ${{ steps.tip.outputs.latest == 'true' }}
        uses: actions/configure-pages@v6
      - id: deployment
        if: ${{ steps.tip.outputs.latest == 'true' }}
        uses: actions/deploy-pages@v5

  # The deployed site, as a person reaches it, once its deploy is served.
  live:
    name: live
    needs: pages
    if: ${{ needs.pages.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # A push to main saves this cache where a pull request can read it.
      - id: playwright
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npx playwright install --with-deps --only-shell chromium
      - uses: actions/cache/save@v6
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npm run test:live
        env:
          PAGES_URL: https://jayostis.github.io/cascade-runtime-js/
          COMMIT: ${{ github.sha }}

  # connect and pull, and try/ in Chromium, against the SMART launcher, a server this project did not write, over the
  # network: nightly and by hand only, so a network failure gates no pull request.
  launcher:
    name: launcher
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pack the package, whose browser build try/ serves
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build every kit's pod and site, and the front page above them
        run: npm run build:pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:launcher

  # The package, packed once from the head of every default branch, so every system below tests the same bytes.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            build/cascade-runtime-*.tgz
            build/release-notes.md
          if-no-files-found: error

  # The package installed and used as a person would, on the systems `release` waits for. installed.yml holds the jobs.
  linux:
    needs: package
    uses: ./.github/workflows/installed.yml
    with:
      systems: '["ubuntu-latest"]'

  # The same jobs on the systems that finish last: nothing needs them, so a release does not wait, and a failure still fails the run.
  other-systems:
    needs: package
    uses: ./.github/workflows/installed.yml
    with:
      systems: '["windows-latest", "macos-latest"]'

  # The tested tarball, as the pre-release build-<commit>, never the latest.
  release:
    name: release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: package
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is a release already"
            exit 0
          fi
          gh release create "$tag" package/cascade-runtime-*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file package/release-notes.md \
            --prerelease \
            --latest=false

  # The command exactly as a person is told to run it, from the release just made.
  starter-release:
    name: starter-release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The starter's check, against the release
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/packages/cascade-runtime/check/starter.mjs" --release "$GITHUB_SHA"
