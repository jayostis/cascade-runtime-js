name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
      - id: pin
        run: echo "vocabulary=$(jq -r .vocabulary.commit cascade-runtime.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: jayostis/cascade-vocabulary
          ref: ${{ steps.pin.outputs.vocabulary }}
          path: cascade-vocabulary
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build a pod and its site
        run: |
          if [ -f ../cascade-vocabulary/conformance/alex-rivera/story.json ]; then
            npm run build:example alex-rivera
          else
            npm run build:story-site -- runtime/vectors/matching/story.json --through entry
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pod-and-site
          path: |
            cascade-runtime-js/build/*/pod
            cascade-runtime-js/build/*/site
          if-no-files-found: error
