name: perf

# The runtime's performance file (packages/cascade-runtime/test/perf-report.ts, a module for each scenario in perf-scenarios/): fixed scenarios over one Synthea
# patient's record, rows in the Bridge spec's result format. Nothing here fails on a slowdown: the files are kept, and a
# pull request is shown its before -> after against the latest push to main.
#
# - A pull request runs the per-build size and comments the comparison against main (one comment, updated). Main is measured
#   in the same job, beside the pull request and on the same runner (the checkout of main, with each repository it reads at its
#   default branch and its Bridge as a push to main resolves it, is under main/), because the same commits took 23% longer
#   on a runner with another processor model: a comparison with a file from another job cannot be read to a few percent. If
#   that run gives no file the job goes on, warns, and the comment compares with the latest push's file as before, saying so.
#   A hand-started run on a branch other than main does the same and puts the comparison in its summary.
# - A push to main and the nightly run write their file to the orphan branch `perf-data`, at
#   runtime/YYYY/MM/DD/<run>-<sha7>-<event>.json, and put the table in the job summary. The nightly run and a
#   hand-started run add the large size, plain and encrypted. A push also names its file in runtime/latest-push.txt,
#   which is what a pull request is compared with: a nightly or hand-started file may hold other sizes. The same job
#   feeds the file's headline rows and slowest stages to github-action-benchmark, which keeps the history page's data and
#   index.html under perf/ on that branch; the `build-pages` job of check.yml copies perf/ into the site, so the page is
#   served at /perf/detail/ by the next deploy (the nightly run is early enough for the 03:17 deploy to hold it). The page at
#   /perf/ is drawn by that job from the files themselves: a stacked chart of where the time goes for each scenario and size.
# - Every run, a pull request's too, also makes flame graphs to drill into: a trace of each scenario's probed run (where the
#   time went, step inside step) and a CPU profile of one more, unprobed run (which code took it, the Bridge's Rust functions by name), as the artifact
#   `perf-flame`, with a short list of each scenario's longest steps in the job summary and the comment. A push, the
#   nightly run and a hand-started run also keep them on their own orphan branch, `perf-flame` (not on `perf-data`, whose
#   history would otherwise grow by megabytes a day for good), in the folder runtime/YYYY/MM/DD/<run>-<sha7>-<event>/:
#   traces for the newest 30 builds, CPU profiles for the newest 5, and the large size's files for the newest 7 builds that
#   ran it. The `keep-flame` job writes that branch as ONE commit, the whole window, and force-pushes it each time, so the
#   branch never has more history than its files; it is the only job that force-pushes, and only that branch. The
#   `build-pages` job of check.yml serves them with the speedscope viewer at /perf/runs/.
# - Every run also loads the same input as plainly as it can into SQLite (the `floor` scenario: parse, flatten to one table per resource type,
#   one SQLite transaction), so that a fresh import's time is read against what loading that input costs: the job summary, the
#   comment, /perf/ and /perf/runs/ say "Import takes X; a plain load of the same input into SQLite takes Y (Zx)", with what each
#   import handled and how fast saving went.
# - Every run also measures what people do after the first import (the `reimport-identical`, `reimport-changed`, `add-one-record`,
#   `reopen-after-kill` and `question-after-update` scenarios), each on a copy of the pod the first import left: /perf/, /perf/runs/, the
#   summary and the comment have a line for each under "What people do after the first import". A pull request and a push run each
#   once and leave out `add-one-record`, on Linux and on the Windows and macOS legs alike; the nightly run runs all five three times.
# - A hand-started run can name one scenario (`fresh-first-screen,floor` is the import and its floor) and one size.
# - Linux is not the only system a person runs this on. A push to main, the nightly run and a hand-started run that asks for
#   `windows`, `macos` or `all` systems also run the same per-build scenario on a GitHub-hosted Windows runner and a macOS one
#   (`perf-systems`; `macos-latest` is Apple silicon), each keeping its own file at
#   runtime/YYYY/MM/DD/<run>-<sha7>-<event>-<system>.json and its own series on the history page, never mixed with Linux's:
#   the times of one system are not read against another's. They are not run on a pull request, which waits for its slowest
#   check: these legs take longer than the whole check does (the pages say how long each takes). They make no flame graphs,
#   which are kept for Linux builds. They measure the per-build size only, on every kind of run: the large size is Linux's.
#   The schedule has not yet run this workflow (its API history has no such run), so the nightly path of these legs is untried.
# - A push, the nightly run and a hand-started run of everything also time what one small file costs (the `file-ops`
#   scenario, `--file-ops`): asking whether it is there, creating it, renaming it, what the folder host does for a file, and one
#   file for all of them. A pull request does not run it. A hand-started run with `scanner` set also does it on the Windows leg
#   with Windows Defender's checking as the runner has it, with all of it on and no folder left out, and with the folder
#   excluded (`--scanner-compare`), and puts every setting back; no other run does, as those runs would pay for it every time. It
#   is honoured with `scenario` all only, as the file micro-bench is run with that alone. The flag refuses to run outside GitHub
#   Actions: on a person's machine, `--scanner-folders` compares a folder Defender leaves alone with one it scans and changes
#   nothing; it measures the file micro-bench alone (never the suite's scenarios) and no workflow runs it.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: "One scenario, or all (`floor` alone writes the load's rows, which no page shows without the import of the same size; use fresh-first-screen,floor)"
        type: choice
        options:
          [
            all,
            fresh-first-screen,
            "fresh-first-screen,floor",
            floor,
            reopen-first-answer,
            question-page,
            close,
            stored,
            reimport-identical,
            reimport-changed,
            add-one-record,
            reopen-after-kill,
            question-after-update,
            "reimport-identical,reimport-changed,add-one-record,reopen-after-kill,question-after-update",
          ]
        default: all
      size:
        description: "One size, or the per-build size and, with `large`, the large one"
        type: choice
        options: [per-build, synthea-10y, synthea-lifetime]
        default: per-build
      large:
        description: "Also run the large size"
        type: boolean
        default: false
      scanner:
        description: "With scenario all only: on the Windows leg, also time the file micro-bench with Windows Defender's checking as the runner has it, all on, and the folder excluded (a hosted runner only; it is changed and put back)"
        type: boolean
        default: false
      systems:
        description: "linux alone, as before, or Windows (a hosted runner), macOS (a hosted Apple silicon one) or all three; only a run on main keeps its files"
        type: choice
        options: [linux, all, windows, macos]
        default: linux

concurrency:
  group: perf-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The measurement. It writes nothing to the repository: the file is kept as an artifact for the two jobs after it.
  perf:
    name: performance file
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      # The day the files are kept under, decided once so that a run that crosses midnight names one folder.
      day: ${{ steps.what.outputs.day }}
    env:
      CASCADE_TEST_OFFLINE: "1"
      # Read by the file's environment: the runner is a hosted one, which other jobs share the machine of.
      PERF_OTHER_LOAD: "a shared hosted runner"
      # Whether main is measured here too, beside this build: a pull request, and a hand-started run on a branch other than main
      # (which has no pull request but is read the same way). A push to main and the nightly run measure only themselves.
      SAME_JOB: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - id: tables-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/cascade-reference-tables
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.tables-at.outputs.repository }}
          ref: ${{ steps.tables-at.outputs.ref }}
          path: cascade-reference-tables
          persist-credentials: false
      # The starter kit, beside this checkout: the file records its commit, and a test of this repository fails when the
      # questions the harness asks first are no longer the kit's.
      - id: kit-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/cascade-starter-kit
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.kit-at.outputs.repository }}
          ref: ${{ steps.kit-at.outputs.ref }}
          path: cascade-starter-kit
          persist-credentials: false
      # Main beside this build, for a run that measures both (SAME_JOB): the runtime at the default branch and each repository it
      # reads, in a folder of their own, so that main reads main's vocabulary, adapters, reference tables and starter kit as a
      # push to main does, and this build reads the ones its Depends-On lines name. Every step may fail: a build of main that
      # cannot be made leaves no file, and the comparison falls back to the latest push's. No credential stays on disk.
      - uses: actions/checkout@v7
        if: ${{ env.SAME_JOB == 'true' }}
        continue-on-error: true
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main/cascade-runtime-js
          persist-credentials: false
      - uses: actions/checkout@v7
        if: ${{ env.SAME_JOB == 'true' }}
        continue-on-error: true
        with:
          repository: the-cascade-protocol/cascade-vocabulary
          path: main/cascade-vocabulary
          persist-credentials: false
      - uses: actions/checkout@v7
        if: ${{ env.SAME_JOB == 'true' }}
        continue-on-error: true
        with:
          repository: the-cascade-protocol/cascade-bridge-adapter-fhir-r4
          path: main/cascade-bridge-adapter-fhir-r4
          persist-credentials: false
      - uses: actions/checkout@v7
        if: ${{ env.SAME_JOB == 'true' }}
        continue-on-error: true
        with:
          repository: the-cascade-protocol/cascade-bridge-adapter-ccda
          path: main/cascade-bridge-adapter-ccda
          persist-credentials: false
      - uses: actions/checkout@v7
        if: ${{ env.SAME_JOB == 'true' }}
        continue-on-error: true
        with:
          repository: the-cascade-protocol/cascade-reference-tables
          path: main/cascade-reference-tables
          persist-credentials: false
      - uses: actions/checkout@v7
        if: ${{ env.SAME_JOB == 'true' }}
        continue-on-error: true
        with:
          repository: the-cascade-protocol/cascade-starter-kit
          path: main/cascade-starter-kit
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # The vocabulary, the adapters (the record measured is the fhir-r4 adapter's bench/ input) and the Bridge's
      # sources, beside this checkout, as `runtime tests` has them.
      - uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      - run: npm ci
      - run: npm run --silent bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The CPU profiles name the Bridge's Rust functions only if its wasm keeps its names; the script lays the release's named module
      # over the package's (what it checks and why are in its header). It never fails the job.
      - name: The Bridge's function names
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/cascade-runtime-js/.github/scripts/bridge-names.sh" "$GITHUB_WORKSPACE/cascade-runtime-js"
      # Which Bridge main reads. When this build's own run picked the newest build of the Bridge's default branch (no Depends-On line
      # and no branch of its name names another), main is pinned to that same commit: left to pick for itself some seconds later,
      # a publish in between would make the two sides read different Bridges with nothing naming one. When something does name
      # another, main reads the newest build as a push to main does, and how the build picked its own is kept for the comment.
      - name: Which Bridge main reads
        id: main-bridge
        if: ${{ env.SAME_JOB == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cache="$GITHUB_WORKSPACE/cascade-runtime-js/build/cache/cascade-bridge-rs"
          read -r source commit < <(node -p "const r = JSON.parse(require('fs').readFileSync('$cache/expected.json', 'utf8')); r.source + ' ' + r.commit")
          how=$(node -p "try { JSON.parse(require('fs').readFileSync('$cache/picked.json', 'utf8')).how } catch { '' }")
          printf '%s' "$how" > "$RUNNER_TEMP/bridge-how.txt"
          case "$how" in
            "the newest build of its default branch"*)
              if [ "$source" = release ]; then
                echo "pin=https://github.com/the-cascade-protocol/cascade-bridge-rs@$commit" >> "$GITHUB_OUTPUT"
                echo "Main reads the Bridge build $commit, the one this build's run picked (the newest of the default branch)."
              fi ;;
            *) echo "This build's Bridge was picked as: ${how:-not recorded}. Main reads the newest build of the default branch." ;;
          esac
      - id: what
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SCENARIO: ${{ inputs.scenario }}
          SIZE: ${{ inputs.size }}
          LARGE: ${{ inputs.large }}
        run: |
          set -euo pipefail
          sizes="synthea-10y"
          if [ "$EVENT" = schedule ] || [ "$LARGE" = true ]; then sizes="synthea-10y,synthea-lifetime"; fi
          if [ -n "$SIZE" ] && [ "$SIZE" != per-build ]; then sizes="$SIZE"; fi
          args="--size $sizes"
          # A pull request and a push to main run each job of every day once, without adding one result (which cost a fifth of the
          # step), so each build's job stays short; the nightly and hand-started runs run them in full.
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then args="$args --light-jobs"; fi
          if [ -n "$SCENARIO" ] && [ "$SCENARIO" != all ]; then args="$args --scenario $SCENARIO"; fi
          # What one file costs is for a push, the nightly run and a hand-started run of everything, never for a pull request.
          if [ "$EVENT" != pull_request ] && { [ -z "$SCENARIO" ] || [ "$SCENARIO" = all ]; }; then args="$args --file-ops"; fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y/%m/%d)" >> "$GITHUB_OUTPUT"
      # Main's build: its dependencies, and the Bridge as main resolves it, which is as a push to main does (the newest build of the
      # Bridge's default branch), never the build this pull request's Depends-On lines pick: the event's file is left out of the
      # environment and the branch is the default one. The run keeps that pick for its attempt, in main's own cache.
      - name: Main's build
        id: main-build
        if: ${{ env.SAME_JOB == 'true' }}
        continue-on-error: true
        working-directory: main/cascade-runtime-js
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
          CASCADE_BRIDGE_PIN: ${{ steps.main-bridge.outputs.pin }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/perf-main.json"
          npm ci
          unset GITHUB_EVENT_PATH
          export GITHUB_REF_NAME="$MAIN_BRANCH" GITHUB_REF="refs/heads/$MAIN_BRANCH"
          GITHUB_TOKEN="$TOKEN" GH_TOKEN="$TOKEN" npm run --silent bridge
          GH_TOKEN="$TOKEN" bash "$GITHUB_WORKSPACE/cascade-runtime-js/.github/scripts/bridge-names.sh" "$PWD" "main's run"
      # Main is measured first, directly before this build, with the same arguments and no flame graphs. In three jobs that ran
      # main, this build (the same commit) and main again, in this order, the fresh import's total of the second run was
      # +0.4%, -0.2% and +1.1% of the first's and of the third +0.5%, +0.7% and +2.3%: a later run is slower by about a
      # percent, never faster. Main first puts that on the build's side, so a build is never shown faster than it is by the
      # order. A second run of main would add 39 s to every pull request's job for under a percent.
      # A step that fails under continue-on-error reports success, so the build's outcome is read, not its status.
      - name: Main's performance file
        if: ${{ env.SAME_JOB == 'true' && steps.main-build.outcome == 'success' }}
        continue-on-error: true
        working-directory: main/cascade-runtime-js
        shell: bash
        env:
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
          ARGS: ${{ steps.what.outputs.args }}
          CASCADE_BRIDGE_PIN: ${{ steps.main-bridge.outputs.pin }}
        run: |
          set -euo pipefail
          unset GITHUB_EVENT_PATH
          export GITHUB_REF_NAME="$MAIN_BRANCH" GITHUB_REF="refs/heads/$MAIN_BRANCH"
          # shellcheck disable=SC2086
          npm run --silent perf -- $ARGS --out "$RUNNER_TEMP/perf-main.json"
      # The traces and CPU profiles are made by the same run: a trace from its probed run, a CPU profile from one more run.
      - name: The performance file
        run: npm run --silent perf -- ${{ steps.what.outputs.args }} --out "$RUNNER_TEMP/perf.json" --profiles "$RUNNER_TEMP/flame"
      - name: The summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          # The steps with the longest own time are listed once, by a later step, with the links to their flame graphs.
          own=""
          [ -f "$RUNNER_TEMP/flame/flame.json" ] && own="--without-own-time"
          if [ -f "$RUNNER_TEMP/perf.json" ]; then
            node scripts/perf-compare.mjs summary "$RUNNER_TEMP/perf.json" --markdown $own >> "$GITHUB_STEP_SUMMARY"
          fi
      # A pull request's comment holds this comparison; a hand-started run on a branch has no comment, so it is in the summary.
      - name: Main beside this build
        if: ${{ env.SAME_JOB == 'true' && github.event_name != 'pull_request' && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/perf.json" ]; then
            how=$(cat "$RUNNER_TEMP/bridge-how.txt" 2>/dev/null || true)
            node scripts/perf-compare.mjs against "$RUNNER_TEMP/perf.json" --same-job "$RUNNER_TEMP/perf-main.json" --subject "this build" --bridge-how "$how" --summary-shown --markdown --without-own-time >> "$GITHUB_STEP_SUMMARY"
          fi
      # A build of main that gave no file is a warning, never a failure: the pull request's own file is the job's result.
      - name: Main's file, or why there is none
        if: ${{ env.SAME_JOB == 'true' && !cancelled() }}
        shell: bash
        run: |
          if [ ! -f "$RUNNER_TEMP/perf-main.json" ]; then
            echo "::warning::main's own run in this job gave no file (see the steps 'Main's build' and 'Main's performance file'), so the comparison falls back to the latest push to main's file"
          fi
      - name: The rows for the history page
        shell: bash
        run: node scripts/perf-history.mjs "$RUNNER_TEMP/perf.json" > "$RUNNER_TEMP/history.json"
      - name: What the flame graph files weigh
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/flame" ]; then
            echo "### The flame graph files" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '| file | size |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---|---:|' >> "$GITHUB_STEP_SUMMARY"
            for file in "$RUNNER_TEMP/flame"/*; do
              printf '| %s | %s |\n' "$(basename "$file")" "$(du -h "$file" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
      # A pull request's files can only be downloaded from here; a push's, the nightly run's and a hand-started run's on main
      # are on `perf-flame` once the `keep-flame` job has run, and the links read them there.
      - uses: actions/upload-artifact@v7
        id: flame
        if: ${{ !cancelled() }}
        with:
          name: perf-flame
          path: ${{ runner.temp }}/flame
          if-no-files-found: error
      - name: Where the time went
        if: ${{ !cancelled() }}
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DAY: ${{ steps.what.outputs.day }}
          DOWNLOAD: ${{ steps.flame.outputs.artifact-url }}
          KEPT: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/where.md"
          [ -f "$RUNNER_TEMP/flame/flame.json" ] || exit 0
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/perf/speedscope/"
          if [ "$KEPT" = true ]; then
            raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/perf-flame/runtime/${DAY}/${GITHUB_RUN_ID}-${GITHUB_SHA::7}-${EVENT}"
            node scripts/perf-flame.mjs summary "$RUNNER_TEMP/flame" --markdown --files "$raw" --viewer "$site" > "$RUNNER_TEMP/where.md"
            echo >> "$RUNNER_TEMP/where.md"
            echo "This build in [where the time goes, over time](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/perf/), and its entry in [the flame graph index](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/perf/runs/#${GITHUB_RUN_ID}-${GITHUB_SHA::7}) (both appear with the next deploy). The links above read the \`perf-flame\` branch and stop working when the build is no longer among the newest 30 kept there; the index lists what each kept build still has." >> "$RUNNER_TEMP/where.md"
          else
            node scripts/perf-flame.mjs summary "$RUNNER_TEMP/flame" --markdown --download "$DOWNLOAD" --viewer "$site" > "$RUNNER_TEMP/where.md"
          fi
          cat "$RUNNER_TEMP/where.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: perf
          path: |
            ${{ runner.temp }}/perf.json
            ${{ runner.temp }}/perf-main.json
            ${{ runner.temp }}/bridge-how.txt
            ${{ runner.temp }}/history.json
            ${{ runner.temp }}/where.md
          if-no-files-found: error

  # The same per-build measurement on a hosted Windows runner and a hosted macOS one (Apple silicon: `macos-latest`), for a push
  # to main, the nightly run and a hand-started run that asks for them, never for a pull request: a pull request waits for its
  # slowest check, and these legs would be slower than all of them. Each leg keeps its own file and its own series; `publish`
  # commits them. They make no flame graphs and measure no main beside the build: the comparison with main is the Linux job's.
  # Nothing here fails on a slowdown, and a leg that fails does not stop the others or the Linux job.
  perf-systems:
    # No `name`: a matrix job is then called `perf-systems (windows)`, and a skipped one by its id, not by an expression nothing resolved.
    if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.systems == 'linux') }}
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.systems != 'all' && format('["{0}"]', inputs.systems) || '["windows", "macos"]') }}
    runs-on: ${{ matrix.system == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 90
    env:
      CASCADE_TEST_OFFLINE: "1"
      PERF_OTHER_LOAD: "a shared hosted runner"
    defaults:
      run:
        shell: bash
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - id: tables-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/cascade-reference-tables
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.tables-at.outputs.repository }}
          ref: ${{ steps.tables-at.outputs.ref }}
          path: cascade-reference-tables
          persist-credentials: false
      - id: kit-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/cascade-starter-kit
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.kit-at.outputs.repository }}
          ref: ${{ steps.kit-at.outputs.ref }}
          path: cascade-starter-kit
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      - uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      # The SQLite binding's binding.gyp sends a lock-based install to node-gyp, which finds no Visual Studio it knows on windows;
      # the binding's prebuilt build is all the checkout needs (installed.yml does the same).
      - run: npm ci ${{ runner.os == 'Windows' && '--ignore-scripts' || '' }}
      - run: npm run --silent bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: what
        env:
          EVENT: ${{ github.event_name }}
          SCENARIO: ${{ inputs.scenario }}
          SIZE: ${{ inputs.size }}
          SYSTEM: ${{ matrix.system }}
          SCANNER: ${{ inputs.scanner }}
        run: |
          set -euo pipefail
          # The per-build size only, on every kind of run: the nightly run's and `large`'s second size is measured on Linux, and has
          # not been timed on these systems (it would run under the 90-minute limit with no figure to say how far under).
          sizes="synthea-10y"
          if [ -n "$SIZE" ] && [ "$SIZE" != per-build ]; then sizes="$SIZE"; fi
          args="--size $sizes"
          if [ -n "$SCENARIO" ] && [ "$SCENARIO" != all ]; then args="$args --scenario $SCENARIO"; fi
          # A push to main runs each job of every day once, as the Linux job does; the nightly and hand-started runs run them in full.
          if [ "$EVENT" = push ]; then args="$args --light-jobs"; fi
          if [ -z "$SCENARIO" ] || [ "$SCENARIO" = all ]; then args="$args --file-ops"; fi
          # Windows Defender's settings are changed, and put back, for more runs of the file micro-bench, only when a person asks, and
          # only with every scenario: the file micro-bench runs with `all` alone, and the comparison is part of it.
          if [ "$SYSTEM" = windows ] && [ "$SCANNER" = true ] && { [ -z "$SCENARIO" ] || [ "$SCENARIO" = all ]; }; then args="$args --scanner-compare"; fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y/%m/%d)" >> "$GITHUB_OUTPUT"
      - name: The performance file
        run: npm run --silent perf -- ${{ steps.what.outputs.args }} --out "$RUNNER_TEMP/perf.json"
      # What Defender settings the runner is left with and what it did while the comparison ran: a run that ends without its file is
      # read from here.
      - name: What Windows Defender did
        if: ${{ !cancelled() && matrix.system == 'windows' && inputs.scanner && (inputs.scenario == 'all' || inputs.scenario == '') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Get-MpComputerStatus | Format-List RealTimeProtectionEnabled, AMRunningMode, IoavProtectionEnabled, BehaviorMonitorEnabled
          Get-MpPreference | Format-List DisableRealtimeMonitoring, DisableIOAVProtection, DisableBehaviorMonitoring, DisableScriptScanning, ExclusionPath
          Get-MpThreatDetection | Format-List InitialDetectionTime, ProcessName, Resources
          Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Windows Defender/Operational'; StartTime = (Get-Date).AddMinutes(-20) } -MaxEvents 40 | Format-List TimeCreated, Id, Message
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-20); Level = 2 } -MaxEvents 20 | Format-List TimeCreated, ProviderName, Message
      - name: The summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/perf.json" ]; then
            node scripts/perf-compare.mjs summary "$RUNNER_TEMP/perf.json" --markdown >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: The rows for the history page
        env:
          DAY: ${{ steps.what.outputs.day }}
        run: |
          set -euo pipefail
          node scripts/perf-history.mjs "$RUNNER_TEMP/perf.json" > "$RUNNER_TEMP/history.json"
          printf '%s' "$DAY" > "$RUNNER_TEMP/day.txt"
      # Only a leg that went through every step above leaves a file: `publish` keeps what is here and nothing of a leg that failed.
      - uses: actions/upload-artifact@v7
        with:
          name: perf-${{ matrix.system }}
          path: |
            ${{ runner.temp }}/perf.json
            ${{ runner.temp }}/history.json
            ${{ runner.temp }}/day.txt
          if-no-files-found: error

  # A pull request: the file against main as the performance job measured it beside the build (the latest push to main on
  # `perf-data` only when that run gave no file), in one comment that each push updates. A
  # comment that cannot be posted (a pull request from a fork has a read-only token) is a warning, never a failure.
  compare:
    name: against main
    if: ${{ github.event_name == 'pull_request' }}
    needs: perf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: perf
          path: pr
      - name: The latest push to main, and the comparison
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- perf-compare -->'
          # Main as this job measured it, beside the pull request, is what the pull request is compared with. The latest push's file,
          # taken on another run and perhaps another machine, is read only when that file is missing or unreadable (main's run in the
          # job failed): then the comment says so and compares with it. Only the pointer and the file it names are fetched, never
          # every file of the branch.
          latest=""
          raw='Accept: application/vnd.github.raw'
          if named=$(gh api -H "$raw" "repos/${GITHUB_REPOSITORY}/contents/runtime/latest-push.txt?ref=perf-data" 2>/dev/null) \
            && [ -n "$named" ] \
            && mkdir -p "base/$(dirname "$named")" \
            && gh api -H "$raw" "repos/${GITHUB_REPOSITORY}/contents/${named}?ref=perf-data" > "base/$named"; then
            latest="base/$named"
          fi
          args=(--markdown --same-job pr/perf-main.json --bridge-how "$(cat pr/bridge-how.txt 2>/dev/null || true)")
          [ -z "$latest" ] || args+=(--latest "$latest" --latest-name "${latest#base/}")
          # The steps with the longest own time are in the flame graph list below, with their links: not twice.
          if [ -f pr/where.md ] && [ -s pr/where.md ]; then args+=(--without-own-time); fi
          {
            echo "$marker"
            echo "### Performance against main"
            echo
            node scripts/perf-compare.mjs against pr/perf.json "${args[@]}"
            echo
            if [ -f pr/where.md ]; then
              cat pr/where.md
              echo
            fi
            echo "What each row means: [the glossary](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/perf-glossary.md). Every main build over time: [where the time goes, over time](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/perf/), and [every measurement as its own small chart](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/perf/detail/)."
            echo
            echo "[Run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PULL}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n 1 || true)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md >/dev/null \
              || echo "::warning::the comparison comment could not be updated"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PULL}/comments" -F body=@comment.md >/dev/null \
              || echo "::warning::the comparison comment could not be posted"
          fi

  # A push to main, the nightly run and a hand-started run: the file is committed to the orphan branch `perf-data`.
  # The only job that writes to the repository, and it runs no code of this repository's: a shell script and
  # github-action-benchmark (pinned to a commit) over the artifact. A push that races another is retried.
  # One leg for each system, one after the other (they push to the same branch): Linux's file and the two others', each under
  # its own name and in its own series, so that no two systems are ever one series. A leg whose artifact is not there (the
  # measurement failed, or was not asked for) keeps nothing and says so; the others go on. Linux's keep also waits for the
  # Windows and macOS legs to end (`needs` names the whole job, not one leg of it), so it comes about 10 minutes after Linux's
  # own measurement; only a delay.
  publish:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [perf, perf-systems]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {
              system: linux,
              artifact: perf,
              suffix: "",
              series: "Runtime performance",
            }
          - {
              system: windows,
              artifact: perf-windows,
              suffix: "-windows",
              series: "Runtime performance (Windows)",
            }
          - {
              system: macos,
              artifact: perf-macos,
              suffix: "-macos",
              series: "Runtime performance (macOS)",
            }
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Linux's file is kept only when its job went through every step, as before: its artifact is uploaded even from a run
      # that failed late, with the file as far as it got.
      - uses: actions/download-artifact@v7
        id: got
        if: ${{ matrix.system != 'linux' || needs.perf.result == 'success' }}
        # Only a Windows or macOS leg may have nothing to download; a Linux file that cannot be fetched fails the leg, so that the
        # push does not go on with latest-push.txt unchanged.
        continue-on-error: ${{ matrix.system != 'linux' }}
        with:
          name: ${{ matrix.artifact }}
          path: file
      - name: Nothing to keep
        if: ${{ steps.got.outcome != 'success' }}
        run: echo "::notice::no performance file of ${{ matrix.system }} to keep from this run"
      - name: Commit it to perf-data
        if: ${{ steps.got.outcome == 'success' }}
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          # The day is decided once by the measuring job, and kept with the file of a Windows or macOS leg.
          DAY: ${{ matrix.system == 'linux' && needs.perf.outputs.day || '' }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          sha7="${GITHUB_SHA::7}"
          [ -n "$DAY" ] || DAY=$(cat file/day.txt)
          path="runtime/${DAY}/${GITHUB_RUN_ID}-${sha7}-${GITHUB_EVENT_NAME}${SUFFIX}.json"
          remote="https://github.com/${GITHUB_REPOSITORY}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git init -q data
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "$remote"
          for attempt in 1 2 3 4 5 6; do
            if git -c http.extraheader="$auth" fetch -q --depth 1 origin perf-data 2>/dev/null; then
              git checkout -q -B perf-data FETCH_HEAD
            else
              git checkout -q --orphan perf-data
              git rm -rfq . 2>/dev/null || true
            fi
            mkdir -p "$(dirname "$path")"
            cp ../file/perf.json "$path"
            git add "$path"
            # A push to main names its file for the pull requests; a push that finished after a newer one does not. Only
            # Linux's file is one a pull request is compared with: a pull request is measured on Linux.
            if [ "$GITHUB_EVENT_NAME" = push ] && [ -z "$SUFFIX" ]; then
              current=$(cat runtime/latest-push.txt 2>/dev/null || true)
              if [ -z "$current" ] || [[ ! "$path" < "$current" ]]; then
                printf '%s\n' "$path" > runtime/latest-push.txt
                git add runtime/latest-push.txt
              fi
            fi
            git commit -q -m "runtime ${sha7}: ${GITHUB_EVENT_NAME} run ${GITHUB_RUN_ID}${SUFFIX}"
            if git -c http.extraheader="$auth" push -q origin HEAD:perf-data; then
              echo "kept as ${path}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push raced; attempt ${attempt}"
            sleep $((RANDOM % 8 + 3))
            git reset -q --hard
          done
          echo "::error::the file could not be pushed to perf-data after six attempts"
          exit 1

      # The detail page (/perf/detail/): github-action-benchmark adds this run's rows to perf/data.js on `perf-data` and keeps perf/index.html,
      # a chart for each measurement over the commits, whose hover shows each row's `extra` (its plain meaning, the data set
      # and the range). The checkout is the data branch alone, so no code of this repository runs here. Nothing alerts:
      # there is no threshold, no comment and nothing fails on a slowdown.
      # Each system is a series of its own: the action keeps the history under the name it is given, so Windows's rows are never
      # drawn in a chart of Linux's.
      - name: Keep the rows where the checkout will not clear them
        if: ${{ steps.got.outcome == 'success' }}
        run: cp file/history.json "$RUNNER_TEMP/history.json"
      # No credential stays on disk while the third-party action runs: it pushes with the `github-token` it is given.
      - uses: actions/checkout@v7
        if: ${{ steps.got.outcome == 'success' }}
        with:
          ref: perf-data
          persist-credentials: false
      # The action fetches `perf-data` into a branch of that name, which git refuses while it is the branch checked out.
      - name: Leave the data branch for the action to fetch
        if: ${{ steps.got.outcome == 'success' }}
        run: git checkout -q --detach
      # `ref` names the commit the run measured: a schedule or hand-started run has no head commit, and the action would
      # otherwise record whatever main is when this job publishes.
      - uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        if: ${{ steps.got.outcome == 'success' }}
        with:
          ref: ${{ github.sha }}
          name: ${{ matrix.series }}
          tool: customSmallerIsBetter
          output-file-path: ${{ runner.temp }}/history.json
          gh-pages-branch: perf-data
          benchmark-data-dir-path: perf
          auto-push: true
          github-token: ${{ github.token }}
          fail-on-alert: false
          comment-on-alert: false
          summary-always: false

  # A push to main, the nightly run and a hand-started run: the flame graph files are written to the orphan branch
  # `perf-flame`, apart from `perf-data`, so that the history of neither grows without end (a plain clone fetches every
  # branch's whole history, and the files weigh megabytes a build). The branch is ONE commit: each run fetches it, adds its
  # build's folder, removes what falls outside the window (traces for the newest 30 builds, CPU profiles for the newest 5,
  # the large size's files for the newest 7 builds that ran it; `KEEP` in scripts/perf-runs.mjs says the same) and
  # force-pushes a new root commit of the whole tree. This is the only job that force-pushes, and it pushes only that
  # branch, with a lease on the commit it started from, so that two runs that finish together cannot overwrite each other:
  # the one that loses fetches again and writes again. It runs no code of this repository's.
  keep-flame:
    name: keep the flame graphs
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: perf
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: perf-flame
          path: flame
      - name: Write the window to perf-flame
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          DAY: ${{ needs.perf.outputs.day }}
        run: |
          set -euo pipefail
          sha7="${GITHUB_SHA::7}"
          folder="runtime/${DAY}/${GITHUB_RUN_ID}-${sha7}-${GITHUB_EVENT_NAME}"
          remote="https://github.com/${GITHUB_REPOSITORY}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          for attempt in 1 2 3 4 5 6; do
            rm -rf data
            git init -q data
            cd data
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "$remote"
            expect=""
            if git -c http.extraheader="$auth" fetch -q --depth 1 origin perf-flame 2>/dev/null; then
              git checkout -q -B window FETCH_HEAD
              expect="$(git rev-parse FETCH_HEAD)"
            fi
            mkdir -p "$folder"
            cp -r ../flame/. "$folder/"
            mapfile -t builds < <(find runtime -mindepth 5 -maxdepth 5 -name flame.json | sed 's|/flame\.json$||' | sort -r)
            at=0
            large=0
            for build in "${builds[@]}"; do
              at=$((at + 1))
              if [ "$at" -gt 30 ]; then
                rm -rf -- "$build"
                continue
              fi
              if [ "$at" -gt 5 ]; then rm -f -- "$build"/*.cpuprofile; fi
              if compgen -G "$build/*synthea-lifetime*" > /dev/null; then
                large=$((large + 1))
                if [ "$large" -gt 7 ]; then rm -f -- "$build"/*synthea-lifetime*; fi
              fi
            done
            find runtime -type d -empty -delete
            # A new root commit of the whole tree, whether or not the branch exists yet.
            git symbolic-ref HEAD refs/heads/next
            git add -A
            git commit -q -m "flame graphs of the newest $((at > 30 ? 30 : at)) builds, newest run ${GITHUB_RUN_ID} (${sha7})"
            if git -c http.extraheader="$auth" push -q --force-with-lease="refs/heads/perf-flame:${expect}" origin HEAD:refs/heads/perf-flame; then
              echo "The flame graphs of this build are on \`perf-flame\` as \`${folder}\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push raced; attempt ${attempt}"
            cd ..
            sleep $((RANDOM % 8 + 3))
          done
          echo "::error::the flame graphs could not be pushed to perf-flame after six attempts"
          exit 1
