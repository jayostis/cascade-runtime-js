name: oxigraph-native

# Oxigraph's in-memory store built for Node from native/oxigraph, for each platform the runtime offers it on. On a pull
# request that changes it, and by hand, each target is built, and loaded and asked its Oxigraph version where the runner
# can run it. A tag oxigraph-native-v<crate version> attaches the four files to a pre-release of that tag, where the
# runtime's fetch script finds them.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - native/oxigraph/**
      - .github/workflows/oxigraph-native.yml
  push:
    tags: ["oxigraph-native-v*"]
  workflow_dispatch:

concurrency:
  group: oxigraph-native-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's glibc, the oldest of a runner, so the file loads on more systems than 24.04's would.
          - asset: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            built: liboxigraph_native.so
            runs: true
          - asset: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            built: oxigraph_native.dll
            runs: true
          - asset: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            built: liboxigraph_native.dylib
            runs: true
          # Built on the arm64 runner for Intel Macs, which it does not run.
          - asset: darwin-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            built: liboxigraph_native.dylib
            runs: false
    defaults:
      run:
        shell: bash
        working-directory: native/oxigraph
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner images preinstall different toolchains, and rust-cache hashes every one it finds into its key.
      - run: |
          rustup toolchain install --profile minimal
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup default "$channel"
          rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/oxigraph
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - if: matrix.asset == 'linux-x64'
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --release --locked --target "${{ matrix.target }}" -- -D warnings
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/${{ matrix.built }}" "out/oxigraph-native.${{ matrix.asset }}.node"
      - uses: actions/setup-node@v5
        if: matrix.runs
        with:
          node-version: "22"
      # The file loads on this platform and names the Oxigraph version Cargo.lock pins.
      - if: matrix.runs
        run: |
          node -e '
            const binding = require(process.argv[1]);
            const pinned = /name = "oxigraph"\nversion = "([^"]+)"/.exec(require("fs").readFileSync("Cargo.lock", "utf8"))[1];
            if (binding.oxigraphVersion() !== pinned) throw new Error(`built with Oxigraph ${binding.oxigraphVersion()}, Cargo.lock pins ${pinned}`);
            const store = new binding.Store();
            store.load("<urn:a> <urn:b> <urn:c> .", { format: "text/turtle" });
            if (store.size !== 1) throw new Error("the store holds " + store.size + " quads after a load of one");
            console.log("Oxigraph", pinned, "loads on", process.platform, process.arch);
          ' "$PWD/out/oxigraph-native.${{ matrix.asset }}.node"
      - uses: actions/upload-artifact@v7
        with:
          name: oxigraph-native-${{ matrix.asset }}
          path: native/oxigraph/out/oxigraph-native.${{ matrix.asset }}.node
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/oxigraph-native-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: oxigraph-native-*
          merge-multiple: true
          path: assets
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" assets/*.node --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
            --title "$TAG" --notes "Oxigraph's in-memory store for Node, built from native/oxigraph at $GITHUB_SHA."
