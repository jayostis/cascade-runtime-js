name: probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  suite:
    name: suite (${{ matrix.variant }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: ["22.23.4", "24.22.2"]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - variant: "22.23.4"
            node: "22.23.4"
          - variant: "24.22.2"
            node: "24.22.2"
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      - run: npm ci
      - run: npm run --silent bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      - run: npx tsc -b
      - name: The suite four times, counting V8 aborts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set +e -uo pipefail
          node --version
          cpu=$(lscpu | sed -n "s/^Model name: *//p" | head -1)
          echo "CPU $cpu"
          flags=""
          case "$VARIANT" in *--no-maglev*) flags="--no-maglev" ;; esac
          aborts=0; failed=0
          for i in 1 2 3 4; do
            start=$(date +%s)
            node scripts/test.mjs $flags > "$RUNNER_TEMP/run-$i.log" 2>&1
            status=$?
            n=$(grep -c "unreachable code" "$RUNNER_TEMP/run-$i.log" || true)
            fails=$(grep -E "^# fail [0-9]+" "$RUNNER_TEMP/run-$i.log" | tail -1)
            files=$(grep -A1 "DoComputeOutputFrames\|V8_Fatal" "$RUNNER_TEMP/run-$i.log" | grep -o "Subtest: [^ ]*" | sort -u | tr '\n' ' ')
            echo "PROBE cpu=\"$cpu\" variant=$VARIANT shard=${{ matrix.shard }} run=$i status=$status aborts=$n ${fails} seconds=$(( $(date +%s) - start )) $files"
            aborts=$((aborts + n))
            [ "$status" = 0 ] || failed=$((failed + 1))
            grep -B2 -A12 "unreachable code" "$RUNNER_TEMP/run-$i.log" | head -60
            grep -E "^not ok" "$RUNNER_TEMP/run-$i.log" | head -20
          done
          echo "PROBE-TOTAL variant=$VARIANT shard=${{ matrix.shard }} cpu=\"$cpu\" aborts=$aborts failed-runs=$failed" | tee -a "$GITHUB_STEP_SUMMARY"
